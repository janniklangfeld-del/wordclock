  <g class="s">
    <text x="352" y="740">○ 8 Schrauben, 10 mm vom Rand</text>
    <text x="352" y="757">  (Mitte Leiste), 2 mm vorbohren</text>
    <text x="352" y="779">⊙ Schlüsselloch zum Aufhängen</text>
    <text x="352" y="796">  (oder Zackenaufhänger)</text>
    <text x="352" y="818">◯ Ø 10 Netzteilkabel</text>
    <text x="352" y="840">▭ Lüftungsschlitze oben + unten</text>
    <text x="352" y="862">⬚ Andruckklötze (innen)</text>
    <text x="352" y="884">- - Innenkante Holzkasten</text>
  </g>

  <!-- ================= BAUSCHRITTE ================= -->
  <text x="610" y="600" class="h">⑤ Bauschritte</text>
  <g class="n">
    <text x="610" y="628"><tspan font-weight="700">1 Maß nehmen.</tspan> Gedruckte Front (4 Teile) zusammenlegen und messen. Weicht sie von 250 ab: Wert in</text>
    <text x="628" y="646">rahmen_variante1.scad eintragen, die neuen Zuschnittmaße stehen in der Konsole.</text>
    <text x="610" y="672"><tspan font-weight="700">2 Kasten.</tspan> Leisten sägen, lange Teile außen, stumpf verleimen, Spanngurt drum. Diagonalen innen</text>
    <text x="628" y="690">gleich lang (je ≈ 354) = rechtwinklig. Über Nacht trocknen.</text>
    <text x="610" y="716"><tspan font-weight="700">3 Schleifen + lackieren.</tspan> Hinten bleiben 15 mm Holz sichtbar (40 − 25) → weiß lackieren.</text>
    <text x="610" y="742"><tspan font-weight="700">4 Profile.</tspan> In der Gehrungslade 45° sägen: vorderer Schenkel flach auf dem Boden, Seitenschenkel</text>
    <text x="628" y="760">am Anschlag. Erst am Probestück üben, trocken anlegen, Gehrungen fein nachschleifen.</text>
    <text x="610" y="786"><tspan font-weight="700">5 Aufkleben.</tspan> Montagekleber dünn aufs Holz, Ecken mit PVC-Kleber, mit Malerkrepp fixieren.</text>
    <text x="628" y="804">Prüfen: Das Profil ragt rundum 3,25 mm in die Öffnung.</text>
    <text x="610" y="830"><tspan font-weight="700">6 Lichttest.</tspan> Handylampe von innen gegen das Profil: Scheint es durch → innen schwarzes Klebeband.</text>
    <text x="610" y="856"><tspan font-weight="700">7 Einlegen</tspan> von hinten: Front → Diffusor → Lichtgitter → LED-Träger mit den verlöteten Streifen.</text>
    <text x="610" y="882"><tspan font-weight="700">8 Schließen.</tspan> Klötze mit Moosgummi auf den LED-Träger, Elektronik auf die Rückwand, Kabel durchs</text>
    <text x="628" y="900">Loch, Rückwand mit 8 Schrauben fest. Abschraubbar → ESP32 und USB bleiben erreichbar.</text>
  </g>
  <rect x="610" y="922" width="860" height="56" rx="10" fill="#fff6dd" stroke="#e3c46a"/>
  <text x="626" y="945" class="n"><tspan font-weight="700">Anderes Profil gekauft?</tspan> Regel: Leistenstärke ≈ Profilschenkel − Profilwand − 3 mm. Mit Profil 30 × 30 und</text>
  <text x="626" y="965" class="n">Leiste 25 mm wird die Uhr ≈ 303,5 außen. In der SCAD-Datei nur profil_a/b/t und holz_w ändern.</text>
</svg>
