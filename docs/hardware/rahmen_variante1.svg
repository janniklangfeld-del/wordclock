      <rect x="257.25" y="990.5" width="16" height="4" rx="2"/><rect x="237.25" y="990.5" width="16" height="4" rx="2"/><rect x="217.25" y="990.5" width="16" height="4" rx="2"/><rect x="197.25" y="990.5" width="16" height="4" rx="2"/>
      <rect x="177.25" y="990.5" width="16" height="4" rx="2"/><rect x="157.25" y="990.5" width="16" height="4" rx="2"/><rect x="137.25" y="990.5" width="16" height="4" rx="2"/><rect x="117.25" y="990.5" width="16" height="4" rx="2"/>
      <rect x="257.25" y="760.25" width="16" height="4" rx="2"/><rect x="237.25" y="760.25" width="16" height="4" rx="2"/><rect x="217.25" y="760.25" width="16" height="4" rx="2"/><rect x="197.25" y="760.25" width="16" height="4" rx="2"/>
      <rect x="177.25" y="760.25" width="16" height="4" rx="2"/><rect x="157.25" y="760.25" width="16" height="4" rx="2"/><rect x="137.25" y="760.25" width="16" height="4" rx="2"/><rect x="117.25" y="760.25" width="16" height="4" rx="2"/>
    </g>
