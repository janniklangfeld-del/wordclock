  <text x="1182" y="373" class="n">20,4</text>
  <line x1="1200" y1="160.5" x2="1200" y2="440.5" class="dim" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="1212" y="305" class="n" transform="rotate(90 1212 305)" text-anchor="middle">Kasten 40</text>
  <line x1="1160" y1="160.5" x2="1205" y2="160.5" class="lead"/><line x1="1160" y1="297.7" x2="1176" y2="297.7" class="lead"/><line x1="1160" y1="440.5" x2="1205" y2="440.5" class="lead"/>
  <text x="600" y="530" class="s">Gesamttiefe 44,5 (Profil 1,5 + Kasten 40 + Rückwand 3). Andruckklotz-Lage hier nur schematisch.</text>
  <text x="600" y="548" class="s">Das Profil ist zugleich der vordere Anschlag: Die Uhr wird von hinten eingelegt und vom Schaum nach vorn gedrückt.</text>

  <!-- ================= ZUSCHNITT / EINKAUF ================= -->
  <text x="1240" y="104" class="h">③ Zuschnitt</text>
  <g class="n">
    <text x="1240" y="132" font-weight="700">Holzleiste 20 × 40, gehobelt</text>
    <text x="1250" y="151">2 × 290,5  oben/unten (durchgehend)</text>
    <text x="1250" y="169">2 × 250,5  links/rechts (dazwischen)</text>
    <text x="1240" y="198" font-weight="700">L-Profil 25 × 25, weiß</text>
    <text x="1250" y="217">4 × 293,5  an der Außenkante,</text>
    <text x="1250" y="235">beide Enden 45° Gehrung</text>
    <text x="1240" y="264" font-weight="700">Rückwand HDF 3 mm</text>
    <text x="1250" y="283">1 × 290,5 × 290,5</text>
    <text x="1240" y="312" font-weight="700">Andruckklötze (3D-Druck)</text>
    <text x="1250" y="331">8 × 15 × 15 × 18,4</text>
  </g>
  <text x="1240" y="372" class="h">Einkauf</text>
  <g class="s">
    <text x="1240" y="396">• Leiste 20 × 40 · 1 × 2 m (Bedarf 1,08 m)</text>
    <text x="1240" y="415">• L-Profil · 2 × 1 m (1,18 m + Probestück)</text>
    <text x="1240" y="434">• HDF 3 mm, am besten weiß beschichtet</text>
    <text x="1240" y="453">• Holzleim, Spanngurt, Gehrungslade</text>
    <text x="1240" y="472">• Montagekleber weiß, für PVC + Holz</text>
    <text x="1240" y="491">• PVC-tauglicher Kleber für die Ecken</text>
    <text x="1240" y="510">• Acryllack weiß seidenmatt, Schleifpapier</text>
    <text x="1240" y="529">• 8 × Spax 3 × 16, Moosgummi 3 mm</text>
  </g>

  <!-- ================= RUECKANSICHT (1 mm = 1 px) ================= -->
  <text x="40" y="700" class="h">④ Rückwand (von hinten)</text>
