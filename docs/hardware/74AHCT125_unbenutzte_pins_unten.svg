<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="system-ui, Segoe UI, Arial, sans-serif">
  <defs>
    <g id="vcc-new"><line x1="0" y1="0" x2="0" y2="-14" stroke="#e8590c" stroke-width="3"/><line x1="-12" y1="-14" x2="12" y2="-14" stroke="#d62828" stroke-width="3"/><text x="0" y="-21" text-anchor="middle" font-size="13" font-weight="700" fill="#d62828">+5 V</text></g>
    <g id="vcc-old"><line x1="0" y1="0" x2="0" y2="-14" stroke="#8a94a6" stroke-width="3"/><line x1="-12" y1="-14" x2="12" y2="-14" stroke="#d62828" stroke-width="3"/><text x="0" y="-21" text-anchor="middle" font-size="13" font-weight="700" fill="#d62828">+5 V</text></g>
    <g id="gnd-new"><line x1="0" y1="0" x2="0" y2="12" stroke="#e8590c" stroke-width="3"/><line x1="-12" y1="12" x2="12" y2="12" stroke="#1d2433" stroke-width="3"/><line x1="-7" y1="17" x2="7" y2="17" stroke="#1d2433" stroke-width="3"/><line x1="-3" y1="22" x2="3" y2="22" stroke="#1d2433" stroke-width="3"/></g>
    <g id="gnd-old"><line x1="0" y1="0" x2="0" y2="12" stroke="#8a94a6" stroke-width="3"/><line x1="-12" y1="12" x2="12" y2="12" stroke="#1d2433" stroke-width="3"/><line x1="-7" y1="17" x2="7" y2="17" stroke="#1d2433" stroke-width="3"/><line x1="-3" y1="22" x2="3" y2="22" stroke="#1d2433" stroke-width="3"/></g>
    <g id="open"><line x1="-7" y1="-7" x2="7" y2="7" stroke="#1d2433" stroke-width="2.5"/><line x1="-7" y1="7" x2="7" y2="-7" stroke="#1d2433" stroke-width="2.5"/></g>
  </defs>

  <rect x="0" y="0" width="980" height="760" rx="18" fill="#eef2f8"/>
  <text x="490" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2433">74AHCT125 – Ansicht von UNTEN (Lötseite)</text>
  <text x="490" y="70" text-anchor="middle" font-size="14" fill="#4a5468">Platine umgedreht, Kerbe des Chips weiterhin oben · gespiegelt: Pin 1 jetzt oben RECHTS</text>

  <!-- Chip liegt auf der anderen Seite: nur gestrichelter Umriss, Lötpunkte als Kreise -->
  <rect x="390" y="110" width="200" height="380" rx="10" fill="#dfe5ef" stroke="#4a5468" stroke-width="2" stroke-dasharray="8 6"/>
  <path d="M470 110 a20 20 0 0 0 40 0" fill="none" stroke="#4a5468" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="490" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#4a5468">74AHCT125</text>
  <text x="490" y="304" text-anchor="middle" font-size="13" fill="#4a5468">Chip liegt auf der</text>
  <text x="490" y="321" text-anchor="middle" font-size="13" fill="#4a5468">anderen Seite</text>

  <!-- Lötpunkte links: Pins 14..8 -->
  <g font-size="14" fill="#1d2433">
    <circle cx="382" cy="160" r="9" fill="#8a94a6"/><text x="400" y="165">14 <tspan font-weight="700">VCC</tspan></text>
    <circle cx="382" cy="210" r="9" fill="#e8590c"/><text x="400" y="215">13 <tspan font-weight="700">4OE</tspan></text>
    <circle cx="382" cy="260" r="9" fill="#e8590c"/><text x="400" y="265">12 <tspan font-weight="700">4A</tspan></text>
    <circle cx="382" cy="310" r="9" fill="#8a94a6"/><text x="400" y="315">11 <tspan font-weight="700">4Y</tspan></text>
    <circle cx="382" cy="360" r="9" fill="#e8590c"/><text x="400" y="365">10 <tspan font-weight="700">3OE</tspan></text>
    <circle cx="382" cy="410" r="9" fill="#e8590c"/><text x="400" y="415">9 <tspan font-weight="700">3A</tspan></text>
    <circle cx="382" cy="460" r="9" fill="#8a94a6"/><text x="400" y="465">8 <tspan font-weight="700">3Y</tspan></text>
  </g>
  <!-- Lötpunkte rechts: Pins 1..7 -->
  <g font-size="14" fill="#1d2433" text-anchor="end">
    <circle cx="598" cy="160" r="9" fill="#8a94a6"/><text x="580" y="165"><tspan font-weight="700">1OE</tspan> 1</text>
    <circle cx="598" cy="210" r="9" fill="#8a94a6"/><text x="580" y="215"><tspan font-weight="700">1A</tspan> 2</text>
    <circle cx="598" cy="260" r="9" fill="#8a94a6"/><text x="580" y="265"><tspan font-weight="700">1Y</tspan> 3</text>
    <circle cx="598" cy="310" r="9" fill="#e8590c"/><text x="580" y="315"><tspan font-weight="700">2OE</tspan> 4</text>
    <circle cx="598" cy="360" r="9" fill="#e8590c"/><text x="580" y="365"><tspan font-weight="700">2A</tspan> 5</text>
    <circle cx="598" cy="410" r="9" fill="#8a94a6"/><text x="580" y="415"><tspan font-weight="700">2Y</tspan> 6</text>
    <circle cx="598" cy="460" r="9" fill="#8a94a6"/><text x="580" y="465"><tspan font-weight="700">GND</tspan> 7</text>
  </g>
  <!-- Markierung Pin 1 -->
  <text x="598" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2433">Pin 1</text>

  <!-- Links (Pins 14..8) -->
  <line x1="373" y1="160" x2="300" y2="160" stroke="#8a94a6" stroke-width="3"/><use href="#vcc-old" x="300" y="160"/>
  <text x="280" y="165" text-anchor="end" font-size="13" fill="#4a5468">+5 V (bleibt), 100 nF nach Pin 7</text>
  <line x1="373" y1="210" x2="300" y2="210" stroke="#e8590c" stroke-width="4"/><use href="#vcc-new" x="300" y="210"/>
  <text x="280" y="215" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">NEU: an +5 V</text>
  <line x1="373" y1="260" x2="300" y2="260" stroke="#e8590c" stroke-width="4"/><use href="#gnd-new" x="300" y="260"/>
  <text x="280" y="265" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">NEU: an GND</text>
  <line x1="373" y1="310" x2="340" y2="310" stroke="#1d2433" stroke-width="2" stroke-dasharray="3 3"/><use href="#open" x="340" y="310"/>
  <text x="322" y="315" text-anchor="end" font-size="13" fill="#1d2433">frei lassen</text>
  <line x1="373" y1="360" x2="300" y2="360" stroke="#e8590c" stroke-width="4"/><use href="#vcc-new" x="300" y="360"/>
  <text x="280" y="365" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">NEU: an +5 V</text>
  <line x1="373" y1="410" x2="300" y2="410" stroke="#e8590c" stroke-width="4"/><use href="#gnd-new" x="300" y="410"/>
  <text x="280" y="415" text-anchor="end" font-size="14" font-weight="700" fill="#e8590c">NEU: an GND</text>
  <line x1="373" y1="460" x2="340" y2="460" stroke="#1d2433" stroke-width="2" stroke-dasharray="3 3"/><use href="#open" x="340" y="460"/>
  <text x="322" y="465" text-anchor="end" font-size="13" fill="#1d2433">frei lassen (wie bisher)</text>

  <!-- Rechts (Pins 1..7) -->
  <line x1="607" y1="160" x2="680" y2="160" stroke="#8a94a6" stroke-width="3"/><use href="#gnd-old" x="680" y="160"/>
  <text x="700" y="165" font-size="13" fill="#4a5468">GND (bleibt)</text>
  <line x1="607" y1="210" x2="740" y2="210" stroke="#8a94a6" stroke-width="3"/>
  <text x="748" y="215" font-size="13" fill="#4a5468">ESP32 GPIO18 (bleibt)</text>
  <line x1="607" y1="260" x2="740" y2="260" stroke="#8a94a6" stroke-width="3"/>
  <text x="748" y="265" font-size="13" fill="#4a5468">330 Ω → LED DIN (bleibt)</text>
  <line x1="607" y1="310" x2="680" y2="310" stroke="#e8590c" stroke-width="4"/><use href="#vcc-new" x="680" y="310"/>
  <text x="700" y="315" font-size="14" font-weight="700" fill="#e8590c">NEU: an +5 V</text>
  <line x1="607" y1="360" x2="680" y2="360" stroke="#e8590c" stroke-width="4"/><use href="#gnd-new" x="680" y="360"/>
  <text x="700" y="365" font-size="14" font-weight="700" fill="#e8590c">NEU: an GND</text>
  <line x1="607" y1="410" x2="640" y2="410" stroke="#1d2433" stroke-width="2" stroke-dasharray="3 3"/><use href="#open" x="640" y="410"/>
  <text x="658" y="415" font-size="13" fill="#1d2433">frei lassen</text>
  <line x1="607" y1="460" x2="680" y2="460" stroke="#8a94a6" stroke-width="3"/><use href="#gnd-old" x="680" y="460"/>
  <text x="700" y="465" font-size="13" fill="#4a5468">GND (bleibt)</text>

  <!-- Zusammenfassung -->
  <rect x="40" y="520" width="440" height="210" rx="12" fill="#fff" stroke="#c9d1de"/>
  <text x="60" y="550" font-size="16" font-weight="700" fill="#1d2433">Was neu gelötet wird</text>
  <g font-size="14" fill="#1d2433">
    <text x="60" y="580"><tspan font-weight="700" fill="#d62828">+5 V:</tspan> Pin 4, 10, 13 (die OE-Pins)</text>
    <text x="60" y="606"><tspan font-weight="700">GND:</tspan> Pin 5, 9, 12 (die Eingänge A)</text>
    <text x="60" y="632"><tspan font-weight="700">Frei lassen:</tspan> Pin 6, 8, 11 (die Ausgänge Y)</text>
    <text x="60" y="666" fill="#4a5468">Von unten liegt Pin 1 oben rechts, Pin 14 oben links.</text>
    <text x="60" y="686" fill="#4a5468">Zur Kontrolle: Pin 7 (GND) und Pin 14 (+5 V) sind die</text>
    <text x="60" y="706" fill="#4a5468">schon verlöteten Ecken unten rechts und oben links.</text>
  </g>

  <rect x="500" y="520" width="440" height="210" rx="12" fill="#fff4e6" stroke="#f0b37a"/>
  <text x="520" y="550" font-size="16" font-weight="700" fill="#9c3d00">Löttipps</text>
  <g font-size="14" fill="#1d2433">
    <text x="520" y="580">• Pin 13 liegt neben 14 (+5 V): kurze Brücke 13–14 ok.</text>
    <text x="520" y="606">• Pin 5, 9, 12 mit Draht an Pin 7 (GND) führen.</text>
    <text x="520" y="632">• Pin 4 und 10 mit Draht an +5 V (z. B. an Pin 14).</text>
    <text x="520" y="658" font-weight="700" fill="#9c3d00">• Achtung, Nachbarn mit verschiedenem Potenzial:</text>
    <text x="536" y="680" fill="#9c3d00">4|5, 9|10 und 12|13 nicht überbrücken!</text>
    <text x="520" y="706">• Nach dem Löten: 14 gegen 7 auf Kurzschluss messen.</text>
  </g>

  <g font-size="12" fill="#4a5468">
    <line x1="40" y1="96" x2="70" y2="96" stroke="#8a94a6" stroke-width="3"/><text x="78" y="100">bestehend</text>
    <line x1="160" y1="96" x2="190" y2="96" stroke="#e8590c" stroke-width="4"/><text x="198" y="100">neu</text>
  </g>
</svg>
