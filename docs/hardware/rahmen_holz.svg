  <line x1="538" y1="165" x2="552" y2="178" class="lead"/><text x="544" y="190" class="s">4 Anschlag</text>
  <text x="60" y="655" class="s">Sichtbar: 20 mm Buche, dann 4 mm schwarzer Anschlag, Front 3 mm zurückgesetzt (Schattenfuge).</text>
  <text x="60" y="671" class="s">Buchstaben beginnen 15 mm hinter der Frontkante → 10,75 mm Abstand zum Anschlag.</text>

