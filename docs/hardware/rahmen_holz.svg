  <g class="s">
    <text x="352" y="742">○ 8 Schrauben, 9 mm vom Rand</text>
    <text x="352" y="758">  (Mitte Holz), 2 mm vorbohren</text>
    <text x="352" y="780">⊙ Schlüsselloch zum Aufhängen</text>
    <text x="352" y="802">◯ Ø 10 Netzteilkabel</text>
    <text x="352" y="824">▭ Lüftungsschlitze oben + unten</text>
    <text x="352" y="846">⬚ Andruckklötze (innen)</text>
    <text x="352" y="868">┏ Eckwinkel (innen, Druck)</text>
