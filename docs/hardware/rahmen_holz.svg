      <circle cx="10" cy="246.9" r="1.6"/><circle cx="10" cy="145.25" r="1.6"/><circle cx="10" cy="43.6" r="1.6"/>
      <circle cx="145.25" cy="280.5" r="1.6"/><circle cx="145.25" cy="10" r="1.6"/>
      <circle cx="55" cy="250.5" r="5"/>
      <circle cx="145.25" cy="95" r="4.5"/><rect x="143" y="83" width="4.5" height="12"/>
      <g>
        <rect x="207.25" y="260.5" width="16" height="4" rx="2"/><rect x="187.25" y="260.5" width="16" height="4" rx="2"/><rect x="167.25" y="260.5" width="16" height="4" rx="2"/><rect x="147.25" y="260.5" width="16" height="4" rx="2"/>
        <rect x="127.25" y="260.5" width="16" height="4" rx="2"/><rect x="107.25" y="260.5" width="16" height="4" rx="2"/><rect x="87.25" y="260.5" width="16" height="4" rx="2"/><rect x="67.25" y="260.5" width="16" height="4" rx="2"/>
        <rect x="207.25" y="30.25" width="16" height="4" rx="2"/><rect x="187.25" y="30.25" width="16" height="4" rx="2"/><rect x="167.25" y="30.25" width="16" height="4" rx="2"/><rect x="147.25" y="30.25" width="16" height="4" rx="2"/>
        <rect x="127.25" y="30.25" width="16" height="4" rx="2"/><rect x="107.25" y="30.25" width="16" height="4" rx="2"/><rect x="87.25" y="30.25" width="16" height="4" rx="2"/><rect x="67.25" y="30.25" width="16" height="4" rx="2"/>
      </g>
    </g>
    <g fill="none" stroke="#2a2d33" stroke-width="0.8" stroke-dasharray="2 2">
      <rect x="217.75" y="217.75" width="15" height="15"/><rect x="137.75" y="217.75" width="15" height="15"/><rect x="57.75" y="217.75" width="15" height="15"/>
      <rect x="217.75" y="137.75" width="15" height="15"/><rect x="57.75" y="137.75" width="15" height="15"/>
      <rect x="217.75" y="57.75" width="15" height="15"/><rect x="137.75" y="57.75" width="15" height="15"/><rect x="57.75" y="57.75" width="15" height="15"/>
      <path d="M20,20 h35 M20,20 v35 M270.5,20 h-35 M270.5,20 v35 M20,270.5 h35 M20,270.5 v-35 M270.5,270.5 h-35 M270.5,270.5 v-35" stroke-width="2.5" stroke-dasharray="none" stroke="#5b5f68"/>
    </g>
  </g>
  <g class="s">
    <text x="352" y="742">○ 8 Schrauben, 10 mm vom Rand</text>
    <text x="352" y="758">  (Mitte Leiste), 2 mm vorbohren</text>
    <text x="352" y="780">⊙ Schlüsselloch zum Aufhängen</text>
    <text x="352" y="802">◯ Ø 10 Netzteilkabel</text>
    <text x="352" y="824">▭ Lüftungsschlitze oben + unten</text>
    <text x="352" y="846">⬚ Andruckklötze (innen)</text>
    <text x="352" y="868">┏ Eckwinkel (innen, Druck)</text>
    <text x="352" y="890">- - Innenkante Rahmen</text>
  </g>

  <!-- ================= BAUSCHRITTE ================= -->
  <g transform="translate(0,190)">
  <text x="600" y="660" class="h">⑥ Bauschritte</text>
  <g class="n">
    <text x="600" y="686"><tspan font-weight="700">1 Messen.</tspan> Gedruckte Front zusammengelegt messen, Leiste nachmessen → Werte in rahmen_holz.scad.</text>
    <text x="600" y="710"><tspan font-weight="700">2 Gehrung.</tspan> Leiste hochkant in die Lade: 20er-Sichtseite unten, 40er-Seite am Anschlag.</text>
    <text x="618" y="727">Erst ein Probestück, dann 4 × 290,5 außen. Alle vier exakt gleich lang (zusammen spannen, messen).</text>
    <text x="600" y="751"><tspan font-weight="700">3 Verleimen.</tspan> Trocken anlegen, Leim auf die Gehrungen, Spanner drum. Diagonalen gleich lang</text>
    <text x="618" y="768">(je ≈ 410,8 außen) = rechtwinklig. Über Nacht trocknen, Eckwinkel hinten bündig einkleben.</text>
    <text x="600" y="792"><tspan font-weight="700">4 Schleifen + ölen.</tspan> 120 → 180 → 240, Kanten leicht brechen, dünn ölen, nach 24 h nochmal.</text>
    <text x="600" y="816"><tspan font-weight="700">5 Anschlag</tspan> bündig mit der Vorderkante innen einkleben (lange Teile oben/unten).</text>
    <text x="600" y="840"><tspan font-weight="700">6 Einlegen</tspan> von hinten: Front → Diffusor → Lichtgitter → LED-Träger mit Streifen.</text>
    <text x="600" y="864"><tspan font-weight="700">7 Schließen.</tspan> Klötze mit Moosgummi, Elektronik auf die Rückwand, Kabel durchs Loch,</text>
    <text x="618" y="881">Rückwand mit 8 Schrauben fest – abnehmbar für USB und Updates.</text>
  </g>
  <rect x="600" y="925" width="870" height="112" rx="10" fill="#fff6dd" stroke="#e3c46a"/>
  <text x="616" y="948" class="n"><tspan font-weight="700">Hinweise</tspan></text>
  <text x="616" y="968" class="s">• Außenmaß 290,5 statt 300: Die Leiste ist 20 mm statt 25 mm breit – schlanker und bei Bauhaus fertig erhältlich.</text>
  <text x="616" y="986" class="s">• Mehr Platz für Elektronik: holz_d in der SCAD-Datei erhöhen (z. B. 40 × 40 Quadratleiste hochkant wäre 40 mm breit sichtbar – zu breit).</text>
  <text x="616" y="1004" class="s">• Anschlag, Eckwinkel und Andruckklötze: part = "anschlag_lang" / "anschlag_kurz" / "eckwinkel" / "andruckklotz" → STL (F6, F7).</text>
  <text x="616" y="1022" class="s">• Preise und Verfügbarkeit laut bauhaus.info am 12.11.2026 – im Markt kurz prüfen.</text>
  </g>
</svg>
