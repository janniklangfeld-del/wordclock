  <!-- ================= BAUSCHRITTE ================= -->
  <text x="600" y="890" class="h">⑥ Bauschritte</text>
  <g class="n">
    <text x="600" y="916"><tspan font-weight="700">1 Messen.</tspan> Gedruckte Front zusammengelegt messen, Streifen nachmessen → Werte in rahmen_holz.scad.</text>
    <text x="600" y="940"><tspan font-weight="700">2 Gehrung.</tspan> Streifen hochkant in die Lade: 18er-Sichtseite unten, 50er-Seite am Anschlag.</text>
    <text x="618" y="957">Erst das Probestück, dann 4 × 286,5 außen. Alle vier exakt gleich lang (zusammen spannen, messen).</text>
    <text x="600" y="981"><tspan font-weight="700">3 Verleimen.</tspan> Trocken anlegen, Leim auf die Gehrungen, Spanner drum. Diagonalen gleich lang</text>
    <text x="618" y="998">(je ≈ 405,2 außen) = rechtwinklig. Über Nacht trocknen, Eckwinkel hinten bündig einkleben.</text>
    <text x="600" y="1022"><tspan font-weight="700">4 Schleifen + ölen.</tspan> 120 → 180 → 240, Kanten leicht brechen, dünn ölen, nach 24 h nochmal.</text>
    <text x="600" y="1046"><tspan font-weight="700">5 Anschlag</tspan> bündig mit der Vorderkante innen einkleben (lange Teile oben/unten).</text>
    <text x="600" y="1070"><tspan font-weight="700">6 Einlegen</tspan> von hinten: Front → Diffusor → Lichtgitter → LED-Träger mit Streifen.</text>
    <text x="600" y="1094"><tspan font-weight="700">7 Schließen.</tspan> Klötze mit Moosgummi, Elektronik auf die Rückwand, Kabel durchs Loch,</text>
    <text x="618" y="1111">Rückwand mit 8 Schrauben fest – abnehmbar für USB und Updates.</text>
  </g>
  <rect x="600" y="1132" width="870" height="94" rx="10" fill="#fff6dd" stroke="#e3c46a"/>
  <text x="616" y="1155" class="n"><tspan font-weight="700">Hinweise</tspan></text>
  <text x="616" y="1175" class="s">• Fertige Buche-Leisten bei Bauhaus sind höchstens 40 tief → zu flach für die 22-mm-Platine. Darum Leimholz-Streifen 18 × 50.</text>
  <text x="616" y="1193" class="s">• Druckteile: part = "anschlag_lang" / "anschlag_kurz" / "eckwinkel" / "andruckklotz" → STL (F6, F7); Rückwand: "rueckwand_2d".</text>
  <text x="616" y="1211" class="s">• Preise und Verfügbarkeit laut bauhaus.info am 12.11.2026 – im Markt kurz prüfen.</text>
</svg>
