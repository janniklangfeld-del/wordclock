  <text x="1262" y="165" class="n">3 Rücksprung</text>
  <line x1="1255" y1="171" x2="1255" y2="308.2" class="dim" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="1262" y="244" class="n">19,6 Uhr</text>
  <line x1="1255" y1="308.2" x2="1255" y2="430" class="dim" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="1262" y="373" class="n">17,4 frei</text>
  <line x1="1340" y1="150" x2="1340" y2="451" class="dim" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="1352" y="300" class="n" transform="rotate(90 1352 300)" text-anchor="middle">Gesamttiefe 43</text>
  <g class="lead"><line x1="1250" y1="150" x2="1345" y2="150"/><line x1="1250" y1="171" x2="1260" y2="171"/><line x1="1250" y1="308.2" x2="1260" y2="308.2"/><line x1="1250" y1="430" x2="1260" y2="430"/><line x1="1030" y1="451" x2="1345" y2="451"/></g>
  <text x="600" y="476" class="s">Die Uhr wird von hinten eingelegt; der Anschlag hält sie vorn, die Andruckklötze drücken sie dagegen. Kein Kleber im Sichtbereich.</text>
  <text x="600" y="492" class="s">Wichtig: Elektronik (ESP32-Platine, WAGO, Elko) darf höchstens ca. 15 mm hoch sein – vorher nachmessen.</text>

  <!-- ================= ZUSCHNITT ================= -->
  <text x="600" y="530" class="h">③ Zuschnitt</text>
  <g class="n">
    <text x="600" y="555"><tspan font-weight="700">Buche 40 × 20:</tspan> 4 × 290,5 außen, Enden 45°</text>
    <text x="618" y="572">(innen 250,5). Aus 1 m passen 3 Stück →</text>
    <text x="618" y="589">2 Leisten = 4 Teile + 2 Probestücke.</text>
    <text x="600" y="611"><tspan font-weight="700">Rückwand:</tspan> 290,5 × 290,5 (Zuschnitt im Markt)</text>
    <text x="600" y="633"><tspan font-weight="700">3D-Druck schwarz:</tspan> Anschlag 2 × 250,5</text>
    <text x="618" y="650">+ 2 × 242,5 (4 × 3), 4 Eckwinkel, 8 Klötze</text>
  </g>

  <!-- ================= EINKAUF ================= -->
  <rect x="1040" y="515" width="430" height="318" rx="12" fill="#ffffff" stroke="#c9d1de"/>
  <text x="1058" y="542" class="h">④ Einkaufsliste BAUHAUS</text>
  <g class="n">
    <text x="1058" y="568" font-weight="700">2 × Rechteckleiste Buche 100 × 40 × 20</text>
    <text x="1070" y="585" class="s">Art.-Nr. 14610733 · je 8,35 € (Stand 12.11.)</text>
    <text x="1058" y="608" font-weight="700">1 × Sperrholz Pappel 3 mm nach Maß</text>
    <text x="1070" y="625" class="s">Art.-Nr. 24815310 · 24,10 €/m² → ca. 2 € + Zuschnitt</text>
    <text x="1070" y="641" class="s">alternativ Hartfaser schwarz 3 mm, Art.-Nr. 14512381</text>
    <text x="1058" y="664">• Gehrungslade mit Feinsäge</text>
    <text x="1058" y="683">• Holzleim (normaler Weißleim reicht)</text>
    <text x="1058" y="702">• Band- bzw. Rahmenspanner mit Eckstücken</text>
    <text x="1058" y="721">• Hartwachsöl „natur hell“</text>
    <text x="1070" y="737" class="s">(farbloses Öl macht Buche dunkler)</text>
    <text x="1058" y="757">• Schleifpapier 120 / 180 / 240 + Schleifklotz</text>
    <text x="1058" y="776">• 8 × Spax 3 × 16, Moosgummi 3 mm</text>
    <text x="1058" y="795">• Sekundenkleber-Gel für die Druckteile</text>
    <text x="1058" y="814">• optional Zackenaufhänger</text>
  </g>

  <!-- ================= RUECKWAND (1 mm = 1 px) ================= -->
  <text x="40" y="712" class="h">⑤ Rückwand (von hinten)</text>
