  <text x="750" y="68" text-anchor="middle" font-size="14" class="m">Maße in mm, aus cad/Wordclock_30x30_v3.scad · Leiste Buche 40 × 20 (BAUHAUS 14610733) · 3D-Modell: cad/rahmen_holz.scad</text>

