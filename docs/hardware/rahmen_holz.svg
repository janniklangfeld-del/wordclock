  <text x="843" y="378" text-anchor="middle" class="s">17,4 mm Platz</text>
  <path d="M780.9,200 V250" stroke="#e05a47" stroke-width="1.6"/>
  <line x1="752" y1="238" x2="779" y2="238" class="lead"/>
  <text x="748" y="242" text-anchor="end" class="s" fill="#e05a47">0,25 Luft</text>
  <!-- Beschriftung rechts -->
  <g class="s">
    <line x1="808" y1="160" x2="1035" y2="160" class="lead" stroke-dasharray="2 2"/><text x="1040" y="164">Anschlag 4 × 3 (Druck, schwarz)</text>
    <line x1="1027" y1="177" x2="1040" y2="180" class="lead"/><text x="1043" y="184">Front 1,8</text>
    <line x1="1027" y1="186.4" x2="1040" y2="198" class="lead"/><text x="1043" y="202">Diffusor 0,8</text>
