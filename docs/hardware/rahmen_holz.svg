    <line x1="1027" y1="294" x2="1040" y2="294" class="lead"/><text x="1043" y="298">LED-Träger 4</text>
    <line x1="1012" y1="362" x2="1040" y2="362" class="lead"/><text x="1043" y="358">Andruckklotz</text><text x="1043" y="373">15,4 (Druck)</text>
    <line x1="1012" y1="423" x2="1040" y2="410" class="lead"/><text x="1043" y="414">Moosgummi 3</text>
    <line x1="1027" y1="440.5" x2="1040" y2="440.5" class="lead"/><text x="1043" y="444">Rückwand 3</text>
