  <text x="600" y="492" class="s">Die Uhr wird von hinten eingelegt; der Anschlag hält sie vorn, die Andruckklötze drücken sie dagegen. Kein Kleber im Sichtbereich.</text>
  <text x="600" y="508" class="s">ESP32-Platine (22) passt mit 5,4 mm Luft. Andruckklötze nicht direkt über die Platine setzen (Lage in der SCAD-Datei: klotz_pos).</text>

  <!-- ================= ZUSCHNITT ================= -->
  <text x="600" y="548" class="h">③ Zuschnitt</text>
  <g class="n">
    <text x="600" y="573"><tspan font-weight="700">Buche 18 × 50:</tspan> 4 × 286,5 außen, Enden 45°</text>
    <text x="618" y="590">(innen 250,5). Bauhaus schneidet 5 Streifen</text>
    <text x="618" y="607">50 × 300 aus der Platte (1 Probestück).</text>
    <text x="600" y="629"><tspan font-weight="700">Rückwand:</tspan> 286,5 × 286,5 (Zuschnitt im Markt)</text>
    <text x="600" y="651"><tspan font-weight="700">3D-Druck schwarz:</tspan> Anschlag 2 × 250,5</text>
    <text x="618" y="668">+ 2 × 242,5 (4 × 3), 4 Eckwinkel, 8 Klötze</text>
  </g>

  <!-- ================= EINKAUF ================= -->
  <rect x="1040" y="530" width="430" height="330" rx="12" fill="#ffffff" stroke="#c9d1de"/>
  <text x="1058" y="557" class="h">④ Einkaufsliste BAUHAUS</text>
  <g class="n">
    <text x="1058" y="583" font-weight="700">Leimholzplatte Buche 18 mm nach Maß</text>
    <text x="1070" y="600" class="s">Art.-Nr. 14455864 · 5 Streifen 50 × 300 zuschneiden lassen</text>
    <text x="1070" y="616" class="s">Streifen ohne Keilzinken-Stoß aussuchen; vorher fragen,</text>
    <text x="1070" y="632" class="s">ob so schmale Streifen geschnitten werden</text>
    <text x="1058" y="655" font-weight="700">Sperrholz Pappel 3 mm nach Maß</text>
    <text x="1070" y="672" class="s">Art.-Nr. 24815310 · 286,5 × 286,5 · 24,10 €/m²</text>
    <text x="1070" y="688" class="s">alternativ Hartfaser schwarz 3 mm, Art.-Nr. 14512381</text>
    <text x="1058" y="711">• Gehrungslade mit Feinsäge (≥ 50 mm Schnitthöhe)</text>
    <text x="1058" y="730">• Holzleim (normaler Weißleim reicht)</text>
    <text x="1058" y="749">• Band- bzw. Rahmenspanner mit Eckstücken</text>
    <text x="1058" y="768">• Hartwachsöl „natur hell“</text>
    <text x="1070" y="784" class="s">(farbloses Öl macht Buche dunkler)</text>
    <text x="1058" y="804">• Schleifpapier 120 / 180 / 240 + Schleifklotz</text>
    <text x="1058" y="823">• 8 × Spax 3 × 16, Moosgummi 3 mm</text>
    <text x="1058" y="842">• Sekundenkleber-Gel für die Druckteile</text>
  </g>

