<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <linearGradient id="holz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7c9a0"/><stop offset=".5" stop-color="#ddb98a"/><stop offset="1" stop-color="#e7c9a0"/>
    </linearGradient>
  </defs>
  <style>
    .dim{stroke:#222;stroke-width:.3;fill:none}
    .ext{stroke:#666;stroke-width:.2;fill:none}
    .hid{stroke:#7a5530;stroke-width:.35;stroke-dasharray:2 1.5;fill:none}
    .holz{fill:url(#holz);stroke:#7a5530;stroke-width:.5}
    .t{font-size:4.2px;fill:#222}
    .s{font-size:3.3px;fill:#555}
    .h{font-size:4.6px;font-weight:700;fill:#222}
    .m{font-size:4.6px;font-weight:700;fill:#222}
  </style>
  <rect width="297" height="210" fill="#fff"/>

  <text x="20" y="15" font-size="7" font-weight="700" fill="#222">Rahmenleiste Buche – Zuschnitt mit 45°-Gehrung · 4 Stück</text>
  <text x="20" y="21" class="s">Wordclock · Holzrahmen · Maße in mm · Stand 12.11.2026</text>

  <!-- ===== Ansicht A: Sichtseite (Trapez) ===== -->
  <text x="20" y="27" class="h">A · Sichtseite von vorn (18 mm breit)</text>
  <polygon class="holz" points="20,44 249.2,44 234.8,58.4 34.4,58.4"/>
  <!-- außen -->
  <line class="ext" x1="20" y1="43" x2="20" y2="37"/><line class="ext" x1="249.2" y1="43" x2="249.2" y2="37"/>
  <line class="dim" x1="20" y1="39" x2="249.2" y2="39" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="112" y="33.6" width="45" height="4.6" fill="#fff"/>
  <text x="134.6" y="37.6" text-anchor="middle" class="m">286,5 außen</text>
  <!-- innen -->
  <line class="ext" x1="34.4" y1="59.4" x2="34.4" y2="65"/><line class="ext" x1="234.8" y1="59.4" x2="234.8" y2="65"/>
  <line class="dim" x1="34.4" y1="63" x2="234.8" y2="63" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="134.6" y="68.5" text-anchor="middle" class="t">250,5 innen</text>
  <!-- 18 -->
  <line class="ext" x1="250.2" y1="44" x2="258" y2="44"/><line class="ext" x1="235.8" y1="58.4" x2="258" y2="58.4"/>
  <line class="dim" x1="255" y1="44" x2="255" y2="58.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="257.5" y="52.8" class="m">18</text>
  <!-- 45° -->
  <path class="dim" d="M 27.5 44 A 7.5 7.5 0 0 1 25.3 49.3"/>
  <text x="11" y="52" class="m">45°</text>
  <path class="dim" d="M 241.7 44 A 7.5 7.5 0 0 0 243.9 49.3"/>
  <text x="262" y="40" class="m">45°</text>
  <text x="134.6" y="53" text-anchor="middle" class="s" fill="#7a5530">lange Kante = außen · beide Enden gegenläufig (Trapez)</text>

  <!-- ===== Ansicht B: Außenseite 50 ===== -->
  <text x="20" y="80" class="h">B · Außenseite (50 mm hoch)</text>
  <rect class="holz" x="20" y="86" width="229.2" height="40"/>
  <line class="hid" x1="34.4" y1="86" x2="34.4" y2="126"/>
  <line class="hid" x1="234.8" y1="86" x2="234.8" y2="126"/>
  <text x="134.6" y="104" text-anchor="middle" class="t">Gehrungsschnitt geht senkrecht durch die volle Breite 50 mm</text>
  <text x="134.6" y="110" text-anchor="middle" class="s">gestrichelt: Innenkante 250,5 (verdeckt)</text>
  <line class="ext" x1="250.2" y1="86" x2="258" y2="86"/><line class="ext" x1="250.2" y1="126" x2="258" y2="126"/>
  <line class="dim" x1="255" y1="86" x2="255" y2="126" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="257.5" y="107.5" class="m">50</text>

  <!-- ===== Querschnitt 1:1 ===== -->
  <text x="266" y="80" class="h">Querschnitt</text>
  <text x="266" y="84.5" class="s">1:1 · ▲ vorn</text>
  <rect class="holz" x="268" y="88" width="18" height="50"/>
  <text x="277" y="143.5" text-anchor="middle" class="m">18</text>
  <text x="277" y="115" text-anchor="middle" class="m" transform="rotate(-90 277 113)">50</text>

  <!-- ===== Rahmen-Skizze ===== -->
  <text x="20" y="140" class="h" font-size="4">4 Leisten ergeben den Rahmen</text>
  <g transform="translate(26,146)">
    <polygon points="0,0 54,0 50.6,3.4 3.4,3.4" fill="#ddb98a" stroke="#7a5530" stroke-width=".4"/>
    <polygon points="54,0 54,54 50.6,50.6 50.6,3.4" fill="#f1e1ca" stroke="#7a5530" stroke-width=".3"/>
    <polygon points="54,54 0,54 3.4,50.6 50.6,50.6" fill="#f1e1ca" stroke="#7a5530" stroke-width=".3"/>
    <polygon points="0,54 0,0 3.4,3.4 3.4,50.6" fill="#f1e1ca" stroke="#7a5530" stroke-width=".3"/>
    <text x="27" y="26" text-anchor="middle" class="s">außen 286,5</text>
    <text x="27" y="31" text-anchor="middle" class="s">× 286,5</text>
  </g>

  <!-- ===== Auftrag ===== -->
  <rect x="94" y="133" width="166" height="70" rx="3" fill="#f7f3ec" stroke="#c9b28f" stroke-width=".4"/>
  <text x="99" y="141" class="h">Bitte zuschneiden – 4 Stück, alle exakt gleich</text>
  <g class="t">
    <text x="99" y="148.5">• Buche-Leimholz 18 mm, Streifen 50 mm breit (Art.-Nr. 14455864)</text>
    <text x="99" y="154.5">• Länge außen <tspan font-weight="700">286,5</tspan> (lange Kante), innen 250,5</text>
    <text x="99" y="160.5">• beide Enden <tspan font-weight="700">45° Gehrung</tspan>, gegenläufig → Trapez</text>
    <text x="99" y="166.5">• Gehrung über die 18 mm, Schnitt durch die vollen 50 mm</text>
    <text x="99" y="172.5">• alle 4 auf ± 0,5 mm gleich lang (sonst klafft eine Ecke)</text>
    <text x="99" y="178.5">• dazu 1 Streifen 50 × 300 gerade als Probestück</text>
  </g>
  <text x="99" y="186" class="s">Kappsäge: hochkant (50 senkrecht), Drehteller 45° – braucht 50 mm Schnitthöhe;</text>
  <text x="99" y="190.5" class="s">oder flach auf der 50er-Seite, Sägeblatt 45° geneigt (Schnitthöhe 18 mm).</text>
  <text x="99" y="197.5" class="s" font-weight="700">Falls keine Gehrung möglich: 5 Streifen 50 × 300 gerade – die Gehrung säge ich selbst.</text>

  <text x="20" y="207" class="s">Maß gilt für eine Front von 250,0 mm (+ 0,5 Luft). Vorher Front messen: Länge außen = Front + 36,5.</text>
</svg>
