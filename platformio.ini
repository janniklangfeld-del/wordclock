; Wordclock fuer Maja – PlatformIO-Projekt
;
;   pio run -e ledtest -t upload       -> LED-Streifen-Test (Hardware pruefen)
;   pio run -e wordclock -t upload     -> eigentliche Uhr-Firmware (per USB)
;   pio run -e wordclock_ota -t upload -> Uhr-Firmware per WLAN (gleiches Netz)
;
; OTA ueber das Internet: Git-Tag "vX.Y.Z" pushen -> GitHub Actions baut ein
; Release -> die Uhr holt es sich selbst (siehe docs/OTA.md).

[platformio]
default_envs = wordclock

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    fastled/FastLED@3.9.4
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

[env:ledtest]
build_src_filter = +<ledtest/>

[env:wordclock]
build_src_filter = +<app/>
board_build.partitions = min_spiffs.csv   ; 2x ~1,9 MB App-Slots fuer OTA
board_build.embed_txtfiles = certs/github_roots.pem
build_flags =
    ${env.build_flags}
    -DWEBSOCKETS_TCP_TIMEOUT=800   ; Senden an ein haengendes Handy blockiert max. 0,8 s (statt 5 s)
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8  ; bis 8 offene Seiten/Handys (lwIP hat 16 Sockets)
extra_scripts =
    pre:scripts/version.py
    pre:scripts/embed_web.py
lib_deps =
    ${env.lib_deps}
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson@7.2.1
    links2004/WebSockets@2.6.1
    aircoookie/Espalexa@2.7.0

[env:wordclock_ota]
extends = env:wordclock
upload_protocol = espota
upload_port = wordclock.local
upload_flags = --auth=${sysenv.WORDCLOCK_OTA_PASSWORD}
